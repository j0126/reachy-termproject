[project]
name = "reachy-cafe"
version = "0.1.0"
description = "Reachy Café: an expressive multimodal robotic kiosk (HRI term project, Team 3)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",
  "rapidfuzz>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# 2단계(데스크톱 + 실제 로봇)에서 쓰는 의존성. HW 코드(reachy_motion, reachy_s2s)는 설치하지 않아도
# config [hw] 경로로 불러온다 (reachy_cafe/robot/hwpaths.py). 버전은 HW3·HW4 pyproject.toml과 같게 고정.
robot = [
  "reachy-mini==1.11.0",
  "reachy-mini-rust-kinematics==1.0.3",
  "reachy-mini-motor-controller==1.5.6",
  "mediapipe==1.0.1",
  "pyyaml",
]
# HW3 음성 스택 중 키오스크가 쓰는 것만 (GUI·Gemini·LLM 서버 의존성은 뺐다)
speech = [
  "faster-whisper>=1.2.1",   # ASR + Silero VAD v6 ONNX
  "supertonic==1.3.1",       # 로컬 한국어/영어 TTS (모델 파일 고정)
  "soxr>=0.5",
  "python-dotenv>=1.0",
]
cuda = [                     # 데스크톱 RTX 4060 Ti: CTranslate2용 cuBLAS 12 + cuDNN 9 (HW3와 같음)
  "nvidia-cublas-cu12",
  "nvidia-cudnn-cu12>=9,<10",
]
sim = ["mujoco==3.3.0"]      # tools/sim_check.py: 로봇 없이 MuJoCo 시뮬 daemon (reachy-mini[mujoco] 1.11.0과 같은 버전)

[project.scripts]
reachy-cafe = "reachy_cafe.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reachy_cafe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
