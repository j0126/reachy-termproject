# Reachy Café motion 'greeting' (neutral) - HW4 schema reachy-motion/v1, loaded by reachy_cafe/robot/motion_library.py.
# DRAFT: initial values for the team to design and tune; set draft: false once signed off.
# Units: angles in degrees (*_deg), head translation in millimetres (*_mm), times in seconds (*_s).
# Write plain decimal numbers (10, -2.5, 1.0e-3); 010, 0x0A, 1:30 and 1_000 are refused.
# Each key moves its track from the previous value (or the start) in duration_s with its easing
# (linear | minjerk | ease_in_out | cartoon), then pauses hold_s. Tracks head/antennas/body run in parallel.
# Head pose values are absolute (relative to the neutral head pose, omitted component = 0), not deltas.
# +pitch = head down. start: rest = neutral head, antennas at rest, body 0.
# expected valence/arousal are design targets, not measured results.
# Neutral variant: same start/end as expressive, linear easing, no sound and no antenna motion (tracks.antennas empty).
# Kiosk timing: the greeting line starts with the 'bow' key (config [motion.sync_labels]).
schema: reachy-motion/v1
name: greeting
variant: neutral
draft: true
intent: A plain bow (hello), no expression.
description: 'One plain bow at a constant 20 deg/s (down 16 deg, held 0.3 s, back), no antennas, no sound. Draft V +0.3:
  a bow reads as a polite hello; A 0.0.'
expected: {valence: 0.3, arousal: 0.0}
principles:
- principle: timing
  how: constant speed (LINEAR), 20 deg/s on both keys
scale: {amplitude: 1.0, tempo: 1.0}
start: rest
tracks:
  head:
  - label: bow
    duration_s: 0.8
    hold_s: 0.3
    easing: linear
    pose: {x_mm: 0.0, y_mm: 0.0, z_mm: 0.0, roll_deg: 0.0, pitch_deg: 16.0, yaw_deg: 0.0}
  - label: back
    duration_s: 0.8
    hold_s: 0.0
    easing: linear
    pose: {x_mm: 0.0, y_mm: 0.0, z_mm: 0.0, roll_deg: 0.0, pitch_deg: 0.0, yaw_deg: 0.0}
  antennas: []
  body: []
sound: null
