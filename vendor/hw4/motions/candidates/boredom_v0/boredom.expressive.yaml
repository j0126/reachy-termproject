# Reachy Mini HW4 motion 'boredom' (expressive) - schema reachy-motion/v1. Edit the values and reload.
# PREVIOUS VERSION (v0) kept for before/after comparison - the library default is motions/<name>.<variant>.yaml (changed 2026-11-11).
# DRAFT: initial values for the student to design and tune; set draft: false once signed off.
# Units: angles in degrees (*_deg), head translation in millimetres (*_mm), times in seconds (*_s).
# Write plain decimal numbers (10, -2.5, 1.0e-3); 010, 0x0A, 1:30 and 1_000 are refused.
# Each key moves its track from the previous value (or the start) in duration_s with its easing
# (linear | minjerk | ease_in_out | cartoon), then pauses hold_s. Tracks head/antennas/body run in parallel.
# Head pose values are absolute (relative to the neutral head pose, omitted component = 0), not deltas.
# Antennas: absolute right_deg/left_deg; 'rest' = the SDK rest angle exactly (-0.1745/+0.1745 rad, i.e.
# -9.998/+9.998 deg; -10/+10 deg is 0.0019 deg off). start: rest = neutral head, antennas at rest, body 0.
# scale.amplitude scales every key about the start; scale.tempo divides every duration and hold.
# expected valence/arousal are design targets, not measured results.
schema: reachy-motion/v1
name: boredom
variant: expressive
draft: true
intent: 'Bored while waiting: slumps, glances away, sighs, comes back.'
description: 'Slow slump (head down, sinks), glance away, sigh, slow return; antennas droop after the head and twitch once.
  Expected V -0.4: head down and drooped antennas; A -0.6: slow keys and long pauses. 0.4 s longer than neutral.'
expected: {valence: -0.4, arousal: -0.6}
principles:
- principle: timing
  how: slow keys (0.8-1.4 s) and long pauses
- principle: slow_in_slow_out
  how: ease_in_out / minjerk everywhere
- principle: follow_through_and_overlapping_action
  how: antennas droop after the head slump and recover last
- principle: secondary_action
  how: one antenna 'twitch' (fidget) while looking away
scale: {amplitude: 1.0, tempo: 1.0}
start: rest
tracks:
  head:
  - label: slump
    duration_s: 1.2
    hold_s: 0.8
    easing: ease_in_out
    pose: {x_mm: 0.0, y_mm: 0.0, z_mm: -8.0, roll_deg: 5.0, pitch_deg: 12.0, yaw_deg: 0.0}
  - label: glance-away
    duration_s: 1.0
    hold_s: 0.7
    easing: minjerk
    pose: {x_mm: 0.0, y_mm: 0.0, z_mm: -6.0, roll_deg: 3.0, pitch_deg: 8.0, yaw_deg: 25.0}
  - label: sigh
    duration_s: 0.8
    hold_s: 0.5
    easing: ease_in_out
    pose: {x_mm: 0.0, y_mm: 0.0, z_mm: -10.0, roll_deg: 4.0, pitch_deg: 16.0, yaw_deg: 0.0}
  - label: back
    duration_s: 1.4
    hold_s: 0.0
    easing: minjerk
    pose: {x_mm: 0.0, y_mm: 0.0, z_mm: 0.0, roll_deg: 0.0, pitch_deg: 0.0, yaw_deg: 0.0}
  antennas:
  - label: wait
    duration_s: 0.3
    hold_s: 0.0
    easing: minjerk
    right_deg: rest
    left_deg: rest
  - label: droop
    duration_s: 1.6
    hold_s: 1.2
    easing: ease_in_out
    right_deg: -60.0
    left_deg: 60.0
  - label: twitch
    duration_s: 0.3
    hold_s: 0.0
    easing: minjerk
    right_deg: -45.0
    left_deg: 60.0
  - label: untwitch
    duration_s: 0.3
    hold_s: 1.5
    easing: minjerk
    right_deg: -60.0
    left_deg: 60.0
  - label: recover
    duration_s: 1.2
    hold_s: 0.0
    easing: minjerk
    right_deg: rest
    left_deg: rest
  body: []
sound: null
