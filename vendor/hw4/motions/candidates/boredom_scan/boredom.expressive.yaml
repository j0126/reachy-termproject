# Reachy Mini HW4 motion 'boredom' (expressive) - schema reachy-motion/v1. Edit the values and reload.
# CANDIDATE 'scan' - Phase 3 alternative to motions/boredom.*.yaml (that draft stays unchanged). Use it with
#   --dir motions/candidates/boredom_scan   (sim-play, check, play, export, gui, sim-verify)
# DRAFT: initial values for the student to design and tune; set draft: false once signed off.
# Units: angles in degrees (*_deg), head translation in millimetres (*_mm), times in seconds (*_s).
# Write plain decimal numbers (10, -2.5, 1.0e-3); 010, 0x0A, 1:30 and 1_000 are refused.
# Each key moves its track from the previous value (or the start) in duration_s with its easing
# (linear | minjerk | ease_in_out | cartoon), then pauses hold_s. Tracks head/antennas/body run in parallel.
# Head pose values are absolute (relative to the neutral head pose, omitted component = 0), not deltas.
# Antennas: absolute right_deg/left_deg; 'rest' = the SDK rest angle exactly (-0.1745/+0.1745 rad, i.e.
# -9.998/+9.998 deg; -10/+10 deg is 0.0019 deg off). start: rest = neutral head, antennas at rest, body 0.
# scale.amplitude scales every key about the start; scale.tempo divides every duration and hold.
# expected valence/arousal are design targets, not measured results.
schema: reachy-motion/v1
name: boredom
variant: expressive
draft: true
intent: 'Bored but still hoping: sighs, slowly looks left and right for a customer, finds nobody, sighs again.'
description: 'Candidate scan. Sigh (head down, sinks), slow look left, slow sweep right, deeper sigh at the centre, slow
  return. Antennas droop, perk a little at each side (anyone there?) and fall back. Expected V -0.3: drooped head and
  antennas; A -0.4: slow sweeps and pauses, the small perks keep it a little livelier than candidate story. 0.2 s longer
  than neutral.'
expected: {valence: -0.3, arousal: -0.4}
principles:
- principle: timing
  how: slow sweeps (look-left 1.2 s, look-right 2.0 s for 50 deg) with 0.7 s pauses at each side
- principle: slow_in_slow_out
  how: minjerk / ease_in_out on every key
- principle: staging
  how: each side glance ends in a still pause so the look reads
- principle: secondary_action
  how: antennas perk slightly at each side (perk-left, perk-right) and fall back
- principle: follow_through_and_overlapping_action
  how: antennas start 0.3 s after the head and recover last
scale: {amplitude: 1.0, tempo: 1.0}
start: rest
tracks:
  head:
  - label: slump
    duration_s: 1.0
    hold_s: 0.3
    easing: ease_in_out
    pose: {x_mm: 0.0, y_mm: 0.0, z_mm: -8.0, roll_deg: 4.0, pitch_deg: 12.0, yaw_deg: 0.0}
  - label: look-left
    duration_s: 1.2
    hold_s: 0.7
    easing: minjerk
    pose: {x_mm: 0.0, y_mm: 0.0, z_mm: -5.0, roll_deg: 3.0, pitch_deg: 6.0, yaw_deg: 25.0}
  - label: look-right
    duration_s: 2.0
    hold_s: 0.7
    easing: minjerk
    pose: {x_mm: 0.0, y_mm: 0.0, z_mm: -5.0, roll_deg: -3.0, pitch_deg: 6.0, yaw_deg: -25.0}
  - label: sigh
    duration_s: 0.9
    hold_s: 0.5
    easing: ease_in_out
    pose: {x_mm: 0.0, y_mm: 0.0, z_mm: -10.0, roll_deg: 4.0, pitch_deg: 16.0, yaw_deg: 0.0}
  - label: back
    duration_s: 1.3
    hold_s: 0.0
    easing: minjerk
    pose: {x_mm: 0.0, y_mm: 0.0, z_mm: 0.0, roll_deg: 0.0, pitch_deg: 0.0, yaw_deg: 0.0}
  antennas:
  - label: wait
    duration_s: 0.3
    hold_s: 0.0
    easing: minjerk
    right_deg: rest
    left_deg: rest
  - label: droop
    duration_s: 1.0
    hold_s: 0.9
    easing: ease_in_out
    right_deg: -50.0
    left_deg: 50.0
  - label: perk-left
    duration_s: 0.4
    hold_s: 0.5
    easing: minjerk
    right_deg: -25.0
    left_deg: 25.0
  - label: fall-left
    duration_s: 0.6
    hold_s: 1.4
    easing: ease_in_out
    right_deg: -55.0
    left_deg: 55.0
  - label: perk-right
    duration_s: 0.4
    hold_s: 0.4
    easing: minjerk
    right_deg: -25.0
    left_deg: 25.0
  - label: droop-deep
    duration_s: 0.9
    hold_s: 0.7
    easing: ease_in_out
    right_deg: -65.0
    left_deg: 65.0
  - label: recover
    duration_s: 1.1
    hold_s: 0.0
    easing: minjerk
    right_deg: rest
    left_deg: rest
  body: []
sound: null
