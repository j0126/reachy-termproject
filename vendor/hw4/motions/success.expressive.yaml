# Reachy Mini HW4 motion 'success' (expressive) - schema reachy-motion/v1. Edit the values and reload.
# Signed-off design (draft: false): the student signed off revision 1 on 2026-11-11 (docs/phase3/MOTION_REVISIONS.md).
# Units: angles in degrees (*_deg), head translation in millimetres (*_mm), times in seconds (*_s).
# Write plain decimal numbers (10, -2.5, 1.0e-3); 010, 0x0A, 1:30 and 1_000 are refused.
# Each key moves its track from the previous value (or the start) in duration_s with its easing
# (linear | minjerk | ease_in_out | cartoon), then pauses hold_s. Tracks head/antennas/body run in parallel.
# Head pose values are absolute (relative to the neutral head pose, omitted component = 0), not deltas.
# Antennas: absolute right_deg/left_deg; 'rest' = the SDK rest angle exactly (-0.1745/+0.1745 rad, i.e.
# -9.998/+9.998 deg; -10/+10 deg is 0.0019 deg off). start: rest = neutral head, antennas at rest, body 0.
# scale.amplitude scales every key about the start; scale.tempo divides every duration and hold.
# expected valence/arousal are design targets, not measured results.
schema: reachy-motion/v1
name: success
variant: expressive
draft: false
intent: Yes! It worked - a happy bounce and nods.
description: 'Crouch -> cartoon pop up -> two damped nods; antennas perk and wiggle. Expected V +0.8: upward, perky motion;
  A +0.6: fast, bouncy timing. 0.1 s longer than neutral.'
expected: {valence: 0.8, arousal: 0.6}
principles:
- principle: anticipation
  how: head 'crouch' (pitch +6, z -5) before the pop
- principle: exaggeration
  how: cartoon 'pop' up with z +5 mm
- principle: follow_through_and_overlapping_action
  how: two damped nods after the pop
- principle: secondary_action
  how: antenna wiggle (+-10 deg) after the perk
scale: {amplitude: 1.0, tempo: 1.0}
start: rest
tracks:
  head:
  - label: crouch
    duration_s: 0.3
    hold_s: 0.0
    easing: ease_in_out
    pose: {x_mm: 0.0, y_mm: 0.0, z_mm: -5.0, roll_deg: 0.0, pitch_deg: 6.0, yaw_deg: 0.0}
  - label: pop
    duration_s: 0.5
    hold_s: 0.15
    easing: cartoon
    pose: {x_mm: 0.0, y_mm: 0.0, z_mm: 5.0, roll_deg: 0.0, pitch_deg: -10.0, yaw_deg: 0.0}
  - label: nod-down
    duration_s: 0.3
    hold_s: 0.0
    easing: minjerk
    pose: {x_mm: 0.0, y_mm: 0.0, z_mm: 0.0, roll_deg: 0.0, pitch_deg: 8.0, yaw_deg: 0.0}
  - label: nod-up
    duration_s: 0.3
    hold_s: 0.0
    easing: minjerk
    pose: {x_mm: 0.0, y_mm: 0.0, z_mm: 0.0, roll_deg: 0.0, pitch_deg: -4.0, yaw_deg: 0.0}
  - label: back
    duration_s: 0.55
    hold_s: 0.0
    easing: minjerk
    pose: {x_mm: 0.0, y_mm: 0.0, z_mm: 0.0, roll_deg: 0.0, pitch_deg: 0.0, yaw_deg: 0.0}
  antennas:
  - label: wait
    duration_s: 0.3
    hold_s: 0.0
    easing: minjerk
    right_deg: rest
    left_deg: rest
  - label: perk
    duration_s: 0.4
    hold_s: 0.0
    easing: cartoon
    right_deg: 15.0
    left_deg: -15.0
  - label: wiggle-a
    duration_s: 0.15
    hold_s: 0.0
    easing: ease_in_out
    right_deg: -5.0
    left_deg: 5.0
  - label: wiggle-b
    duration_s: 0.15
    hold_s: 0.0
    easing: ease_in_out
    right_deg: 15.0
    left_deg: -15.0
  - label: wiggle-c
    duration_s: 0.15
    hold_s: 0.0
    easing: ease_in_out
    right_deg: -5.0
    left_deg: 5.0
  - label: settle
    duration_s: 0.6
    hold_s: 0.0
    easing: minjerk
    right_deg: rest
    left_deg: rest
  body: []
sound:
  file: success.wav
  at_s: 0.3
