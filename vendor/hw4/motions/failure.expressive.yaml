# Reachy Mini HW4 motion 'failure' (expressive) - schema reachy-motion/v1. Edit the values and reload.
# Signed-off design (draft: false): the student signed off revision 1 on 2026-11-11; revision 2 on 2026-11-14
# adds the effect sound only - the movement is unchanged (docs/phase3/MOTION_REVISIONS.md).
# Units: angles in degrees (*_deg), head translation in millimetres (*_mm), times in seconds (*_s).
# Write plain decimal numbers (10, -2.5, 1.0e-3); 010, 0x0A, 1:30 and 1_000 are refused.
# Each key moves its track from the previous value (or the start) in duration_s with its easing
# (linear | minjerk | ease_in_out | cartoon), then pauses hold_s. Tracks head/antennas/body run in parallel.
# Head pose values are absolute (relative to the neutral head pose, omitted component = 0), not deltas.
# Antennas: absolute right_deg/left_deg; 'rest' = the SDK rest angle exactly (-0.1745/+0.1745 rad, i.e.
# -9.998/+9.998 deg; -10/+10 deg is 0.0019 deg off). start: rest = neutral head, antennas at rest, body 0.
# scale.amplitude scales every key about the start; scale.tempo divides every duration and hold.
# expected valence/arousal are design targets, not measured results.
schema: reachy-motion/v1
name: failure
variant: expressive
draft: false
intent: 'Oh no - it failed: small flinch, slumps with antennas down, shakes the head, recovers.'
description: 'Small flinch -> slow slump with a tilt, antennas droop late -> head shake while slumped -> slow recovery. Expected
  V -0.6: head down and drooped antennas; A -0.3: slow, sad rather than angry. 1.7 s longer than neutral (the slump).'
expected: {valence: -0.6, arousal: -0.3}
principles:
- principle: anticipation
  how: head 'flinch' (pitch -4, z +3) before the slump
- principle: timing
  how: quick flinch 0.2 s vs slow slump 0.9 s
- principle: follow_through_and_overlapping_action
  how: antenna droop lags the head and recovers after it
- principle: secondary_action
  how: head shake while slumped
- principle: exaggeration
  how: slump with roll tilt and z -8 mm
scale: {amplitude: 1.0, tempo: 1.0}
start: rest
tracks:
  head:
  - label: flinch
    duration_s: 0.2
    hold_s: 0.0
    easing: ease_in_out
    pose: {x_mm: 0.0, y_mm: 0.0, z_mm: 3.0, roll_deg: 0.0, pitch_deg: -4.0, yaw_deg: 0.0}
  - label: slump
    duration_s: 0.9
    hold_s: 0.4
    easing: ease_in_out
    pose: {x_mm: 0.0, y_mm: 0.0, z_mm: -8.0, roll_deg: -8.0, pitch_deg: 18.0, yaw_deg: 0.0}
  - label: shake-left
    duration_s: 0.35
    hold_s: 0.0
    easing: minjerk
    pose: {x_mm: 0.0, y_mm: 0.0, z_mm: -8.0, roll_deg: -6.0, pitch_deg: 16.0, yaw_deg: 10.0}
  - label: shake-right
    duration_s: 0.35
    hold_s: 0.0
    easing: minjerk
    pose: {x_mm: 0.0, y_mm: 0.0, z_mm: -8.0, roll_deg: -6.0, pitch_deg: 16.0, yaw_deg: -10.0}
  - label: center
    duration_s: 0.3
    hold_s: 0.3
    easing: minjerk
    pose: {x_mm: 0.0, y_mm: 0.0, z_mm: -8.0, roll_deg: -6.0, pitch_deg: 16.0, yaw_deg: 0.0}
  - label: recover
    duration_s: 0.9
    hold_s: 0.0
    easing: minjerk
    pose: {x_mm: 0.0, y_mm: 0.0, z_mm: 0.0, roll_deg: 0.0, pitch_deg: 0.0, yaw_deg: 0.0}
  antennas:
  - label: wait
    duration_s: 0.3
    hold_s: 0.0
    easing: minjerk
    right_deg: rest
    left_deg: rest
  - label: droop
    duration_s: 0.9
    hold_s: 1.4
    easing: ease_in_out
    right_deg: -80.0
    left_deg: 80.0
  - label: recover
    duration_s: 1.0
    hold_s: 0.0
    easing: minjerk
    right_deg: rest
    left_deg: rest
  body: []
sound:
  file: failure.wav
  at_s: 0.2
